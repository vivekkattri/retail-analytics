[project]
name = "retail-analytics"
version = "0.1.0"
description = "Sales and customer analytics on the UCI Online Retail II dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]